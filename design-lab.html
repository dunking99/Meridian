<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Design Lab</title>
<!-- Scratch page for trying out component designs. Not part of the app: it reads
     two of your real holdings from the local API (nothing is invented) and draws
     each design from them. Open at /design-lab.html while the dev server runs. -->
<style>
  :root { --bg:#eef1f5; --card:#fff; --line:#e3e7ee; --text:#14181f; --mute:#5b6370; --faint:#6a7280; --up:#0a8f6a; --down:#d23b4a; --blue:#2f64d0; --track:#e6eaf1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding:28px 32px 60px; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--mute); margin:0 0 26px; }
  h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:34px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card .tag { font-size:11px; color:var(--faint); padding:8px 14px 0; font-weight:600; letter-spacing:.04em; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--line); min-height:64px; }
  .card .tag + .row { border-top:none; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .up { color:var(--up); } .down { color:var(--down); }
  .small { font-size:11px; color:var(--mute); }
  .t { font-weight:700; } .n { font-size:11px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { width:34px; height:34px; border-radius:50%; background:#e8edf5; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font:700 10px ui-monospace, Consolas, monospace; color:#4a5568; flex:none; }
  .tile { width:34px; height:34px; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font:700 11px ui-monospace, Consolas, monospace; flex:none; }
  .chip { font-size:9.5px; border:1px solid var(--line); border-radius:3px; padding:0 4px; color:var(--mute); }
  .bar { height:6px; border-radius:3px; background:var(--track); position:relative; overflow:hidden; } .bar > i { position:absolute; inset:0 auto 0 0; background:var(--blue); border-radius:3px; }
  .grow { flex:1; min-width:0; }
  #err { color:var(--down); }
</style>
</head>
<body>
<h1>Design Lab</h1>
<p class="sub">Four to five options each for the Holding, Weight, 30D and 52W columns, drawn from two of your real holdings. <span id="err"></span></p>
<div id="root"></div>
<script>
const API = "http://localhost:4001";
const fmt = (v, d = 1) => (v == null ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(d)}%`);
const gbp = v => "£" + Math.round(v).toLocaleString("en-GB");
const col = v => (v >= 0 ? "var(--up)" : "var(--down)");
const hues = ["#2f64d0", "#a8660d", "#7a4fc4", "#1b8190", "#a84a8a"];
const abbr = s => s.replace(/\..*$/, "").slice(0, 4);

// ── sparkline helpers ──
function pts(vs, w, h, pad = 2) {
  const lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1;
  return vs.map((v, i) => [pad + (i / (vs.length - 1)) * (w - 2 * pad), h - pad - ((v - lo) / r) * (h - 2 * pad)]);
}
const line = (vs, w = 110, h = 30, c) => { const p = pts(vs, w, h); return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" points="${p.map(x => x.join(",")).join(" ")}"/><circle cx="${p.at(-1)[0]}" cy="${p.at(-1)[1]}" r="2.4" fill="${c}"/></svg>`; };
const area = (vs, w = 110, h = 30, c) => { const p = pts(vs, w, h); const d = p.map(x => x.join(",")).join(" "); return `<svg width="${w}" height="${h}"><polygon points="${p[0][0]},${h} ${d} ${p.at(-1)[0]},${h}" fill="${c}" opacity=".16"/><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${d}"/></svg>`; };
const bars = (vs, w = 110, h = 30) => { const bw = w / vs.length; const lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1; return `<svg width="${w}" height="${h}">${vs.map((v, i) => { const prev = vs[i - 1] ?? v; const bh = 3 + ((v - lo) / r) * (h - 5); return `<rect x="${i * bw + 0.5}" y="${h - bh}" width="${bw - 1.5}" height="${bh}" fill="${v >= prev ? "var(--up)" : "var(--down)"}" opacity=".8"/>`; }).join("")}</svg>`; };
const baseline = (vs, w = 110, h = 30) => { const p = pts(vs, w, h); const lo = Math.min(...vs), hi = Math.max(...vs), r = hi - lo || 1; const y0 = h - 2 - ((vs[0] - lo) / r) * (h - 4); const c = col(vs.at(-1) - vs[0]); return `<svg width="${w}" height="${h}"><line x1="0" x2="${w}" y1="${y0}" y2="${y0}" stroke="var(--faint)" stroke-dasharray="2 3"/><polyline fill="none" stroke="${c}" stroke-width="1.6" points="${p.map(x => x.join(",")).join(" ")}"/></svg>`; };
const hilo = (vs, w = 110, h = 30) => { const p = pts(vs, w, h); const iHi = vs.indexOf(Math.max(...vs)), iLo = vs.indexOf(Math.min(...vs)); const c = col(vs.at(-1) - vs[0]); return `<svg width="${w}" height="${h}"><polyline fill="none" stroke="${c}" stroke-width="1.5" points="${p.map(x => x.join(",")).join(" ")}"/><circle cx="${p[iHi][0]}" cy="${p[iHi][1]}" r="2.6" fill="var(--up)"/><circle cx="${p[iLo][0]}" cy="${p[iLo][1]}" r="2.6" fill="var(--down)"/></svg>`; };

const HOLDING = [
  ["A · Round badge", r => `<div class="badge">${abbr(r.symbol)}</div><div class="grow"><div class="t mono">${r.symbol}</div><div class="n">${r.name}</div></div>`],
  ["B · Colour tile + type", (r, i) => `<div class="tile" style="background:${hues[i]}">${abbr(r.symbol).slice(0, 3)}</div><div class="grow"><div><span class="t">${r.symbol}</span> <span class="chip">${r.type}</span></div><div class="n">${r.name}</div></div>`],
  ["C · Name first", r => `<div class="grow"><div class="t" style="font-size:14px">${r.name}</div><div class="small mono">${r.symbol} · ${r.country ?? "no country"}</div></div>`],
  ["D · Left stripe", (r, i) => `<div style="width:3px;align-self:stretch;border-radius:2px;background:${hues[i]}"></div><div class="grow"><div class="t mono" style="font-size:15px">${r.symbol}</div><div class="n">${r.name}</div></div><span class="chip">${r.type}</span>`],
  ["E · Compact line", r => `<div class="badge" style="width:26px;height:26px;font-size:8px">${abbr(r.symbol)}</div><div class="grow n" style="font-size:12.5px;color:var(--text)"><b class="mono">${r.symbol}</b> <span style="color:var(--mute)">${r.name}</span></div>`],
];
const WEIGHT = [
  ["A · Number + thin bar", r => `<div class="grow"><div class="mono" style="font-size:15px">${(r.weight).toFixed(1)}%</div><div class="bar" style="margin-top:5px"><i style="width:${Math.min(100, r.weight * 2.4)}%"></i></div></div>`],
  ["B · Bar with number inside", r => `<div class="grow" style="height:24px;background:var(--track);border-radius:4px;position:relative;overflow:hidden"><i style="position:absolute;inset:0 auto 0 0;width:${Math.min(100, r.weight * 2.4)}%;background:var(--blue);opacity:.85"></i><span class="mono" style="position:relative;line-height:24px;padding-left:8px;color:#fff;font-weight:700">${r.weight.toFixed(1)}%</span></div>`],
  ["C · Ten-block meter", r => { const n = Math.round(r.weight / 2.5); return `<div class="grow"><div style="display:flex;gap:2px">${Array.from({ length: 10 }, (_, i) => `<i style="flex:1;height:12px;border-radius:2px;background:${i < n ? "var(--blue)" : "var(--track)"}"></i>`).join("")}</div><div class="small mono" style="margin-top:4px">${r.weight.toFixed(1)}% of the book</div></div>`; }],
  ["D · Ring", r => { const c = 2 * Math.PI * 14, f = Math.min(1, r.weight / 25) * c; return `<svg width="38" height="38"><circle cx="19" cy="19" r="14" fill="none" stroke="var(--track)" stroke-width="5"/><circle cx="19" cy="19" r="14" fill="none" stroke="var(--blue)" stroke-width="5" stroke-dasharray="${f} ${c}" transform="rotate(-90 19 19)"/></svg><div class="mono" style="font-size:15px">${r.weight.toFixed(1)}%</div>`; }],
  ["E · Tick scale", r => `<div class="grow"><div style="position:relative;height:18px;border-bottom:1px solid var(--line)"><i style="position:absolute;bottom:0;left:0;width:${Math.min(100, r.weight * 2.4)}%;height:8px;background:var(--blue);border-radius:2px 2px 0 0"></i>${[0, 10, 20, 30].map(p => `<span style="position:absolute;left:${p * 2.4}%;bottom:-13px;font-size:8px;color:var(--faint)">${p}</span>`).join("")}</div><div class="mono" style="font-size:13px;margin-top:14px">${r.weight.toFixed(1)}%</div></div>`],
];
const THIRTY = [
  ["A · Line + end dot", r => `<div>${line(r.closes30, 110, 30, col(r.trend30Pct))}<div class="small mono ${r.trend30Pct >= 0 ? "up" : "down"}">${fmt(r.trend30Pct)}</div></div>`],
  ["B · Filled area", r => `<div>${area(r.closes30, 110, 34, col(r.trend30Pct))}<div class="small mono ${r.trend30Pct >= 0 ? "up" : "down"}">${fmt(r.trend30Pct)}</div></div>`],
  ["C · Daily bars", r => `<div>${bars(r.closes30, 110, 34)}<div class="small">30 days · <span class="mono ${r.trend30Pct >= 0 ? "up" : "down"}">${fmt(r.trend30Pct)}</span></div></div>`],
  ["D · Start-line baseline", r => `<div style="display:flex;align-items:center;gap:8px">${baseline(r.closes30, 100, 32)}<span class="mono ${r.trend30Pct >= 0 ? "up" : "down"}" style="font-size:13px">${fmt(r.trend30Pct)}</span></div>`],
  ["E · High and low marked", r => `<div>${hilo(r.closes30, 110, 32)}<div class="small"><span class="up">▲ high</span> · <span class="down">▼ low</span></div></div>`],
];
const FIFTY2 = [
  ["A · Track with dot", r => { const g = r.range52; return `<div class="grow"><div style="position:relative;height:6px;background:var(--track);border-radius:3px;margin:8px 0 6px"><i style="position:absolute;top:-3px;left:calc(${g.positionPct}% - 6px);width:12px;height:12px;border-radius:50%;background:var(--text)"></i></div><div class="small mono" style="display:flex;justify-content:space-between"><span>${g.low.toFixed(0)}</span><span>${g.high.toFixed(0)}</span></div></div>`; }],
  ["B · Gradient bar + % from high", r => { const g = r.range52; return `<div class="grow"><div style="position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--down),#e9e3d0,var(--up))"><i style="position:absolute;top:-3px;left:calc(${g.positionPct}% - 2px);width:4px;height:16px;background:var(--text);border-radius:2px"></i></div><div class="small mono" style="margin-top:5px">${(100 - g.positionPct).toFixed(0)}% below the 52-week high</div></div>`; }],
  ["C · Percent in range + gauge", r => { const g = r.range52; return `<div style="display:flex;align-items:center;gap:10px"><div style="width:10px;height:36px;background:var(--track);border-radius:5px;position:relative"><i style="position:absolute;left:0;right:0;bottom:0;height:${g.positionPct}%;background:var(--blue);border-radius:5px"></i></div><div><div class="mono" style="font-size:16px">${g.positionPct.toFixed(0)}%</div><div class="small">of the 52-week range</div></div></div>`; }],
  ["D · Prices at each end", r => { const g = r.range52; return `<div class="grow" style="display:flex;align-items:center;gap:8px"><span class="small mono">${g.low.toFixed(0)}</span><div style="flex:1;height:2px;background:var(--line);position:relative"><i style="position:absolute;top:-5px;left:calc(${g.positionPct}% - 5px);border:5px solid transparent;border-top:8px solid var(--blue)"></i></div><span class="small mono">${g.high.toFixed(0)}</span></div>`; }],
  ["E · Five zones", r => { const g = r.range52, z = Math.min(4, Math.floor(g.positionPct / 20)); return `<div class="grow"><div style="display:flex;gap:2px">${[0, 1, 2, 3, 4].map(i => `<i style="flex:1;height:10px;border-radius:2px;background:${i === z ? "var(--blue)" : "var(--track)"}"></i>`).join("")}</div><div class="small" style="margin-top:5px">${["Near the low", "Lower half", "Middle", "Upper half", "Near the high"][z]}</div></div>`; }],
];

function section(title, designs, rows) {
  return `<h2>${title}</h2><div class="grid">${designs.map(([name, f]) => `<div class="card"><div class="tag">${name}</div>${rows.map((r, i) => `<div class="row">${f(r, i)}</div>`).join("")}</div>`).join("")}</div>`;
}

(async () => {
  try {
    const j = await (await fetch(`${API}/portfolio/holdings/enriched`)).json();
    const rows = j.data.rows.filter(r => ["ASML", "AAPL"].includes(r.symbol)).map(r => ({ ...r, weight: r.weight, range52: { ...r.range52, positionPct: r.range52.positionPct } }));
    document.getElementById("root").innerHTML = section("Holding", HOLDING, rows) + section("Weight", WEIGHT, rows) + section("30D", THIRTY, rows) + section("52W", FIFTY2, rows);
  } catch (e) { document.getElementById("err").textContent = "Could not read your holdings from the local API on port 4001: " + e.message; }
})();
</script>
</body>
</html>
